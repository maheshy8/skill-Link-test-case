<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Edit Profile – Skill Link</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">
  <div class="max-w-xl mx-auto mt-12 bg-white p-6 rounded-lg shadow">
    <h1 class="text-2xl font-bold mb-4">Edit Profile</h1>
    <form id="profileForm" class="space-y-4">
      <input type="text" id="firstName" class="w-full border rounded px-3 py-2" required />
      <input type="text" id="lastName" class="w-full border rounded px-3 py-2" required />
      <button type="submit" class="bg-primary text-white px-4 py-2 rounded hover:bg-primary/90">Save</button>
    </form>
  </div>

  <script>
    const API_BASE = "http://localhost:3000/api";
    const user = JSON.parse(localStorage.getItem("user"));
    const token = localStorage.getItem("token");

    if (!user || !token) {
      alert("⚠️ Please login first.");
      window.location.href = "login.html";
    }

    document.getElementById("firstName").value = user.firstName;
    document.getElementById("lastName").value = user.lastName;

    document.getElementById("profileForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const updatedUser = {
        firstName: document.getElementById("firstName").value,
        lastName: document.getElementById("lastName").value
      };

      try {
        const res = await fetch(`${API_BASE}/worker/update-profile/${user._id}`, {
          method: "PUT",
          headers: {
            "Content-Type": "application/json",
            Authorization: `Bearer ${token}`
          },
          body: JSON.stringify(updatedUser)
        });

        if (!res.ok) throw new Error("Update failed");

        const newUser = await res.json();
        localStorage.setItem("user", JSON.stringify(newUser));
        alert("✅ Profile updated!");
        window.location.href = "dashboard.html";
      } catch (err) {
        alert("❌ Could not update profile.");
        console.error(err);
      }
    });
  </script>
</body>
</html>
